<title>Паровой Торг</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Макет: шапка с датчиками, под ней вкладки; на широком экране рынок и журнал в две колонки.
   Палитра: чертёжный сине-серый, латунь для денег и меток, медянка для «купить/дёшево». */
:root {
  --bg: #E3E9EC;
  --panel: #F2F5F6;
  --panel-2: #E9EEF0;
  --ink: #15232A;
  --muted: #566972;
  --line: #BFCCD2;
  --brass: #94650F;
  --brass-bg: #F0E3C4;
  --verd: #1C766B;
  --verd-bg: #D3EAE5;
  --danger: #A23628;
  --danger-bg: #F2D9D4;
  --focus: #1C766B;
  --sky-top: #A9CAD6;
  --sky-bot: #E4EDF0;
  --cloud: rgba(255, 255, 255, 0.7);
  --f-display: 'Forum', 'Times New Roman', serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E171B;
    --panel: #16232A;
    --panel-2: #1D2D35;
    --ink: #E3EAED;
    --muted: #94A6AE;
    --line: #2C3F48;
    --brass: #DDA94F;
    --brass-bg: #3A2F17;
    --verd: #55B8A9;
    --verd-bg: #153B37;
    --danger: #EA7C69;
    --danger-bg: #43211C;
    --focus: #55B8A9;
    --sky-top: #16313D;
    --sky-bot: #2A4856;
    --cloud: rgba(200, 225, 232, 0.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E171B;
  --panel: #16232A;
  --panel-2: #1D2D35;
  --ink: #E3EAED;
  --muted: #94A6AE;
  --line: #2C3F48;
  --brass: #DDA94F;
  --brass-bg: #3A2F17;
  --verd: #55B8A9;
  --verd-bg: #153B37;
  --danger: #EA7C69;
  --danger-bg: #43211C;
  --focus: #55B8A9;
  --sky-top: #16313D;
  --sky-bot: #2A4856;
  --cloud: rgba(200, 225, 232, 0.16);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
}
.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 12px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

h1, h2, h3 {
  font-family: var(--f-display);
  font-weight: 400;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin: 0;
  text-wrap: balance;
}
h1 { font-size: 26px; line-height: 1.1; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
small, .small { font-size: 12px; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* шапка */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { min-width: 0; }
.brand .sub { display: block; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; margin-top: 2px; }
.net {
  font-family: var(--f-mono); font-size: 12px; padding: 4px 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted);
}
.net.on { color: var(--verd); border-color: var(--verd); }
.net.ro { color: var(--brass); border-color: var(--brass); }

/* датчики */
.gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.gauge { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; min-width: 0; }
.gauge .lab { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.gauge .val { font-family: var(--f-mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.gauge .val small { font-size: 12px; }
.gauge.money .val { color: var(--brass); }
.bar { height: 5px; background: var(--panel-2); margin-top: 5px; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--verd); }
.bar.warn > i { background: var(--brass); }
.bar.crit > i { background: var(--danger); }

/* вкладки */
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); background: var(--panel); }
.tabs button {
  background: none; border: 0; border-right: 1px solid var(--line); padding: 10px 2px;
  font-size: 13px; cursor: pointer; color: var(--muted); min-width: 0;
}
.tabs button:last-child { border-right: 0; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

/* панели */
.panel { background: var(--panel); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kind { font-size: 12px; color: var(--brass); letter-spacing: 0.08em; text-transform: uppercase; }
.lead { margin: 0; color: var(--muted); max-width: 62ch; }

/* кнопки */
.btn {
  background: var(--panel-2); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer;
  min-height: 34px; font-size: 13px;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.buy { border-color: var(--verd); color: var(--verd); }
.btn.sell { border-color: var(--brass); color: var(--brass); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); padding: 8px 16px; font-weight: 600; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }

/* рынок */
.goods { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr);
  gap: 4px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center;
}
.row .gname { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row .gprice b, .row .ghave b { font-family: var(--f-mono); font-weight: 500; font-size: 16px; display: block; }
.row .gprice small, .row .gsell small, .row .ghave small { font-family: var(--f-mono); display: block; }
.row .gsell b { font-family: var(--f-mono); font-weight: 500; font-size: 16px; display: block; }
.row .ghave { grid-column: 1 / -1; display: flex; gap: 8px; align-items: baseline; }
.row .ghave b { display: inline; font-size: 14px; }
.row .ghave small { display: inline; }
.row .gact { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.row .gact .sp { flex: 1; }
.tag { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 6px; border: 1px solid; font-weight: 500; }
.tag.cheap { color: var(--verd); background: var(--verd-bg); border-color: var(--verd); }
.tag.dear { color: var(--brass); background: var(--brass-bg); border-color: var(--brass); }
.trend { font-family: var(--f-mono); font-size: 11px; }

.services { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.svc { border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--panel-2); }

/* карта */
.mapbox { border: 1px solid var(--line); background: var(--panel-2); overflow: hidden; }
.mapbox svg { display: block; width: 100%; height: auto; }
.m-grid { stroke: var(--line); stroke-width: 1; opacity: 0.6; }
.m-range { fill: none; stroke: var(--verd); stroke-width: 1.2; stroke-dasharray: 5 5; opacity: 0.8; }
.m-route { stroke: var(--brass); stroke-width: 2; stroke-dasharray: 6 4; }
.m-node { fill: var(--panel); stroke: var(--ink); stroke-width: 2; cursor: pointer; }
.m-node.here { fill: var(--brass); }
.m-node.sel { stroke: var(--brass); stroke-width: 3.5; }
.m-label { font-family: var(--f-body); font-size: 13px; fill: var(--ink); pointer-events: none; font-weight: 600; }
.m-cap { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.dest-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.dest { border: 1px solid var(--line); background: var(--panel-2); padding: 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.dest[aria-pressed="true"] { border-color: var(--brass); box-shadow: inset 3px 0 0 var(--brass); }
.dest.far { opacity: 0.6; }
.dest .nm { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.facts { display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.goodlist { font-size: 12px; color: var(--muted); }
.goodlist b { color: var(--ink); font-weight: 500; }

/* характеристики и улучшения */
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); background: var(--panel-2); padding: 8px 10px; }
.stat .lab { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat .val { font-family: var(--f-mono); font-size: 17px; font-weight: 500; }
.upgrades { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.upg { border: 1px solid var(--line); background: var(--panel-2); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.pips { display: flex; gap: 4px; }
.pips i { width: 18px; height: 8px; border: 1px solid var(--brass); }
.pips i.on { background: var(--brass); }

/* команда */
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.slot-lab { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.card { border: 1px solid var(--line); background: var(--panel-2); padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; border-top-width: 4px; }
.card.rare { border-top-color: var(--verd); }
.card.epic { border-top-color: var(--brass); }
.card.common { border-top-color: var(--muted); }
.card .nm { font-weight: 600; }
.card .rar { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.card .eff { font-family: var(--f-mono); font-size: 12px; color: var(--verd); }
.card .ln { font-size: 12px; color: var(--muted); font-style: italic; }
.card.empty { border-style: dashed; color: var(--muted); align-items: flex-start; justify-content: center; min-height: 92px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }

/* рейтинг */
.board { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.brow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.brow .pos { font-family: var(--f-mono); color: var(--muted); }
.brow .who { overflow-wrap: anywhere; }
.brow.me { background: var(--brass-bg); }
.field { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field input { font: inherit; padding: 7px 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; flex: 1 1 180px; }

/* журнал и всплывающие */
.log { border: 1px solid var(--line); background: var(--panel); padding: 10px 14px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.log div { display: flex; gap: 10px; }
.log .d { font-family: var(--f-mono); color: var(--muted); flex: none; width: 3.5em; }
.log div:first-child { color: var(--ink); font-weight: 500; }
.log div:not(:first-child) { color: var(--muted); }
.toast { min-height: 20px; font-size: 13px; color: var(--danger); }

.modal {
  position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 17, 0.62);
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.modal .box { background: var(--panel); border: 1px solid var(--ink); border-top: 5px solid var(--danger); max-width: 440px; width: 100%; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal .box.is-buy { border-top-color: var(--verd); }
.modal .box.is-over { border-top-color: var(--danger); }
.risk { padding: 0 6px; border: 1px solid; font-size: 11px; }
.risk.low { color: var(--verd); border-color: var(--verd); background: var(--verd-bg); }
.risk.mid { color: var(--brass); border-color: var(--brass); background: var(--brass-bg); }
.risk.high { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
.modal .box.is-sell { border-top-color: var(--brass); }
.qty { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.qty b { font-size: 28px; font-weight: 500; }
.slider { display: flex; align-items: center; gap: 10px; }
.slider input[type="range"] { flex: 1; min-width: 0; height: 32px; accent-color: var(--verd); }
.box.is-sell .slider input[type="range"] { accent-color: var(--brass); }
.slider .btn { min-width: 40px; min-height: 40px; font-size: 18px; padding: 0; }
.sum { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.sum > div { display: flex; justify-content: space-between; gap: 10px; }
.sum .gain { color: var(--verd); }
.sum .loss { color: var(--danger); }
.modal .odds { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

@media (min-width: 760px) {
  .row { grid-template-columns: minmax(0, 1.4fr) minmax(0, 0.8fr) minmax(0, 0.8fr) minmax(0, 0.9fr) auto; }
  .row .ghave { grid-column: auto; display: block; }
  .row .ghave b { display: block; font-size: 16px; }
  .row .ghave small { display: block; }
  .row .gact { grid-column: auto; flex-wrap: nowrap; }
  .tabs button { font-size: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar > i { transition: width 0.25s ease; }
}

.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px; }
.stage { border: 1px solid var(--line); background: var(--panel-2); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.stage .facts { align-items: center; }
.card .imm { font-size: 12px; color: var(--verd); }

/* графика: слоты заполняются картинками из art/, без файлов элементы не рисуются */
.banner-img { display: block; width: 100%; aspect-ratio: 4 / 1; max-height: 190px; object-fit: cover; border: 1px solid var(--line); }
#banner:empty { display: none; }
.hero-img { display: block; width: 100%; aspect-ratio: 21 / 8; object-fit: cover; border: 1px solid var(--line); }
.thumb { display: block; width: 100%; aspect-ratio: 16 / 6; object-fit: cover; border: 1px solid var(--line); margin-bottom: 4px; }
.gicon { width: 28px; height: 28px; object-fit: contain; flex: none; }
.row .gname { flex-wrap: nowrap; }
.row .gname > span:not(.tag) { min-width: 0; overflow-wrap: anywhere; }
.ctop { display: flex; gap: 10px; align-items: flex-start; }
.ctext { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pic { width: 64px; height: 64px; object-fit: cover; border: 1px solid var(--line); flex: none; }
.shiphero { display: block; width: 100%; aspect-ratio: 3 / 1; object-fit: contain; background: linear-gradient(var(--sky-top), var(--sky-bot)); border: 1px solid var(--line); }
.evimg { display: block; width: 100%; aspect-ratio: 16 / 7; object-fit: cover; border: 1px solid var(--line); }
.bulletin { display: flex; gap: 12px; align-items: flex-start; padding: 10px; border: 1px solid var(--line); background: var(--panel-2); margin-bottom: 8px; }
.bulletin p { margin: 0; flex: 1; min-width: 0; }
.bimg { width: 96px; aspect-ratio: 3 / 2; object-fit: cover; flex: none; border: 1px solid var(--line); }

/* перелёт */
.modal .box.flightbox { border-top-color: var(--verd); max-width: 520px; }
.sky { position: relative; height: 150px; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(var(--sky-top), var(--sky-bot)); }
.clouds { position: absolute; inset: 0; background-repeat: repeat-x; animation: drift linear infinite; }
.clouds.c1 { --tile: 320px; background-size: 320px 100%; animation-duration: 12s;
  background-image: radial-gradient(ellipse 58px 15px at 40px 34px, var(--cloud) 96%, transparent), radial-gradient(ellipse 84px 18px at 210px 78px, var(--cloud) 96%, transparent); }
.clouds.c2 { --tile: 480px; background-size: 480px 100%; animation-duration: 22s; opacity: 0.8;
  background-image: radial-gradient(ellipse 110px 20px at 90px 118px, var(--cloud) 96%, transparent), radial-gradient(ellipse 70px 14px at 330px 22px, var(--cloud) 96%, transparent); }
@keyframes drift { to { background-position: calc(var(--tile) * -1) 0; } }
.track { position: absolute; inset: 0; display: flex; width: 400%; animation: pan 24s linear infinite; }
.track img { width: 25%; height: 100%; object-fit: cover; flex: none; }
.track img.flip { transform: scaleX(-1); }
@keyframes pan { to { transform: translateX(-50%); } }
.flyer { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translate(-50%, calc(-50% - 6px)); } }
.shipsvg { display: block; width: 200px; height: auto; }
.shipsvg .env { fill: var(--brass-bg); stroke: var(--ink); stroke-width: 3; }
.shipsvg .rib { fill: none; stroke: var(--brass); stroke-width: 2; }
.shipsvg .fin, .shipsvg .gon, .shipsvg .prop { fill: var(--ink); }
.shipsvg .strut { stroke: var(--ink); stroke-width: 2; }
.shipsvg .prop { transform-origin: 154px 81px; animation: spin 0.25s linear infinite; }
@keyframes spin { 50% { transform: scaleY(0.2); } }
.flyimg { display: block; height: 96px; width: auto; max-width: 70vw; }
.fl-meta { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 13px; color: var(--muted); }
.fl-meta b { color: var(--ink); font-size: 16px; font-weight: 500; }
@media (prefers-reduced-motion: reduce) {
  .clouds, .track, .flyer, .shipsvg .prop { animation: none; }
}

</style>
<div class="wrap">
  <div id="banner"></div>
  <header class="top">
    <div class="brand">
      <h1>Паровой Торг</h1>
      <span class="sub">Фан-проект по мотивам цикла «Герметикон» Вадима Панова</span>
    </div>
    <div class="net" id="net">Автономно</div>
  </header>
  <section class="gauges" id="gauges" aria-label="Состояние цеппелина"></section>
  <nav class="tabs" role="tablist" aria-label="Разделы игры">
    <button role="tab" data-tab="market">Рынок</button>
    <button role="tab" data-tab="map">Карта</button>
    <button role="tab" data-tab="ship">Корабль</button>
    <button role="tab" data-tab="crew">Команда</button>
    <button role="tab" data-tab="rank">Рейтинг</button>
  </nav>
  <main id="view"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <section class="log" id="log" aria-label="Журнал рейсов"></section>
</div>
<div class="modal" id="modal" hidden></div>
<script>
// ============================================================
// ЯДРО ИГРЫ — чистая логика без DOM и без сети.
// Всё, что видит интерфейс, идёт через функции ниже.
// Всё, что может быть общим для игроков (давление на цены, рейтинг),
// идёт через PressureStore и Backend (см. app.js).
// ============================================================

const SAVE_KEY = 'paroviy-torg-v4';
const PRESSURE_STEP = 0.01;           // сдвиг цены за единицу товара в сделке
const PRESSURE_MIN = -0.35;
const PRESSURE_MAX = 0.6;
const PRESSURE_HALF_LIFE_MS = 15 * 60 * 1000; // давление рынка убывает вдвое за 15 минут
const FUEL_PRICE = 8;
const REPAIR_PRICE = 8;
const MAX_UPG = 5;
const START_CASH = 1200;
const YAMAUDA_BONUS = 1.1;   // ямауда считаются отличными цепарями: эффект карты выше на 10%
const WAGE_MUL = 1.5;        // множитель жалованья команды
// Пауза на перелёт: на каждый игровой день планетного этапа приходится столько реальных миллисекунд.

// ---------- утилиты ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function hashStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0) / 4294967296;
}

function rnd(s) { // mulberry32 поверх состояния игры
  s.seed = (s.seed + 0x6D2B79F5) | 0;
  let t = s.seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function note(s, text) {
  s.log.push({ d: s.day, t: text });
  if (s.log.length > 40) s.log.shift();
  return text;
}

function equipped(s) {
  return ROLE_ORDER.map(r => s.crew[r]).filter(Boolean).map(id => CARD[id]);
}

function stats(s) {
  const c = equipped(s);
  const sum = k => c.reduce((a, x) => a + (x.eff[k] || 0), 0);
  return {
    hold: 15 + s.upg.hold * 5 + sum('hold'),
    tank: 30 + s.upg.tank * 5,
    hullMax: 40 + s.upg.hull * 10 + sum('hull') + 8, // +8: базовая обшивка
    guns: 1 + s.upg.gun + sum('guns'),
    fuelMul: Math.max(0.5, 1 + sum('fuel')),
    signMul: Math.max(0.3, 1 + sum('sign')),
    dmgMul: Math.max(0.3, 1 + sum('dmg')),
    buyMul: 1 + sum('buy'),
    sellMul: 0.92 + sum('sell'),
    wage: c.reduce((a, x) => a + x.wage, 0),
  };
}

function cargoCount(s) {
  return Object.values(s.hold).reduce((a, n) => a + n, 0);
}

function netWorth(s) {
  let w = s.cash;
  for (const [g, n] of Object.entries(s.hold)) w += Math.round(n * GOOD[g].base * 0.9);
  return Math.round(w);
}

// ---------- рынок ----------
class PressureStore {
  constructor(now) {
    this.docs = {};
    this.now = now || (() => Date.now());
    this.onWrite = null;
  }
  get(key) {
    const d = this.docs[key];
    if (!d) return 0;
    return d.p * Math.pow(0.5, (this.now() - d.t) / PRESSURE_HALF_LIFE_MS);
  }
  // Давление хранится отдельно для покупки (ключ _b, от 0 вверх) и продажи (ключ _s, от 0 вниз).
  // Покупка поднимает только цену покупки, продажа опускает только цену продажи.
  add(key, delta) {
    const range = pressureRange(key);
    if (!range) return 0;
    const [lo, hi] = range;
    const p = clamp(this.get(key) + delta, lo, hi);
    const d = { p: Math.round(p * 10000) / 10000, t: this.now() };
    this.docs[key] = d;
    if (this.onWrite) this.onWrite(key, d);
    return p;
  }
  ingest(key, d) {
    if (d && typeof d.p === 'number' && typeof d.t === 'number' && isFinite(d.p) && isFinite(d.t)) {
      const range = pressureRange(key);
      if (!range) return; // чужие и устаревшие ключи игнорируем
      this.docs[key] = { p: clamp(d.p, range[0], range[1]), t: d.t };
    }
  }
}

const pkey = (planetId, goodId, dir) => planetId + '_' + goodId + '_' + dir; // dir: 'b' или 's'
function pressureRange(key) {
  if (key.endsWith('_b')) return [0, PRESSURE_MAX];
  if (key.endsWith('_s')) return [PRESSURE_MIN, 0];
  return null;
}

function priceFactor(planetId, goodId) {
  const p = PLANET[planetId];
  if (p.cheap.includes(goodId)) return 0.72;
  if (p.dear.includes(goodId)) return 1.38;
  return 1.0;
}

function noise(planetId, goodId, day) {
  const bucket = Math.floor(day / 4);
  const a = hashStr(planetId + '|' + goodId + '|' + bucket);
  const b = hashStr(planetId + '|' + goodId + '|' + (bucket + 1));
  const f = (day % 4) / 4;
  return 0.9 + 0.2 * (a + (b - a) * f);
}

function quote(s, store, planetId, goodId) {
  const st = stats(s);
  const pb = store ? store.get(pkey(planetId, goodId, 'b')) : 0; // >= 0
  const ps = store ? store.get(pkey(planetId, goodId, 's')) : 0; // <= 0
  const mid = GOOD[goodId].base * priceFactor(planetId, goodId) * noise(planetId, goodId, s.day);
  return {
    mid,
    buy: Math.max(1, Math.round(mid * (1 + pb) * st.buyMul)),
    sell: Math.max(1, Math.round(mid * (1 + ps) * st.sellMul)),
    ratio: mid / GOOD[goodId].base,
    pb,
    ps,
  };
}

function buy(s, store, goodId, n) {
  if (s.over) return { ok: false, msg: 'Игра окончена.' };
  const st = stats(s);
  const q = quote(s, store, s.planet, goodId);
  const free = st.hold - cargoCount(s);
  if (free <= 0) return { ok: false, msg: 'Трюм полон.' };
  const afford = Math.floor(s.cash / q.buy);
  if (afford <= 0) return { ok: false, msg: 'Не хватает денег.' };
  n = Math.min(n, free, afford);
  if (n <= 0) return { ok: false, msg: 'Нечего покупать.' };
  const cost = n * q.buy;
  s.cash -= cost;
  s.hold[goodId] = (s.hold[goodId] || 0) + n;
  s.basis[goodId] = (s.basis[goodId] || 0) + cost;
  if (store) store.add(pkey(s.planet, goodId, 'b'), n * PRESSURE_STEP);
  note(s, 'Куплено: ' + GOOD[goodId].name + ' ×' + n + ' по ' + q.buy + '.');
  return { ok: true, n, price: q.buy, cost };
}

function sell(s, store, goodId, n) {
  if (s.over) return { ok: false, msg: 'Игра окончена.' };
  const have = s.hold[goodId] || 0;
  n = Math.min(n, have);
  if (n <= 0) return { ok: false, msg: 'Нечего продавать.' };
  const q = quote(s, store, s.planet, goodId);
  const revenue = n * q.sell;
  const cost = (s.basis[goodId] || 0) * (n / have);
  s.cash += revenue;
  s.hold[goodId] = have - n;
  s.basis[goodId] = Math.max(0, (s.basis[goodId] || 0) - cost);
  if (s.hold[goodId] <= 0) { delete s.hold[goodId]; delete s.basis[goodId]; }
  const profit = Math.round(revenue - cost);
  s.stats.profit += profit;
  if (store) store.add(pkey(s.planet, goodId, 's'), -n * PRESSURE_STEP);
  note(s, 'Продано: ' + GOOD[goodId].name + ' ×' + n + ' по ' + q.sell + ' (' + (profit >= 0 ? '+' : '') + profit + ').');
  return { ok: true, n, price: q.sell, revenue, profit };
}

function refuel(s, n) {
  const st = stats(s);
  n = Math.min(n, st.tank - s.fuel, Math.floor(s.cash / FUEL_PRICE));
  if (n <= 0) return { ok: false, msg: s.fuel >= st.tank ? 'Бак полон.' : 'Не хватает денег.' };
  s.cash -= n * FUEL_PRICE;
  s.fuel += n;
  note(s, 'Заправка: +' + n + ' топлива за ' + n * FUEL_PRICE + '.');
  return { ok: true, n };
}

function repair(s, n) {
  const st = stats(s);
  n = Math.min(n, st.hullMax - s.hull, Math.floor(s.cash / REPAIR_PRICE));
  if (n <= 0) return { ok: false, msg: s.hull >= st.hullMax ? 'Корпус цел.' : 'Не хватает денег.' };
  s.cash -= n * REPAIR_PRICE;
  s.hull += n;
  note(s, 'Ремонт: +' + n + ' прочности за ' + n * REPAIR_PRICE + '.');
  return { ok: true, n };
}

// ---------- улучшения и команда ----------
function upgradeCost(s, kind) {
  return UPGRADES[kind].base * (s.upg[kind] + 1);
}

function upgrade(s, kind) {
  if (s.upg[kind] >= MAX_UPG) return { ok: false, msg: 'Максимальный уровень.' };
  const cost = upgradeCost(s, kind);
  if (s.cash < cost) return { ok: false, msg: 'Не хватает денег.' };
  s.cash -= cost;
  s.upg[kind]++;
  note(s, 'Улучшение: ' + UPGRADES[kind].name + ' — уровень ' + s.upg[kind] + '.');
  return { ok: true, cost };
}

function tavernList(s) {
  const bucket = Math.floor(s.day / 8);
  return CARDS
    .filter(c => !s.owned.includes(c.id))
    .map(c => ({ c, h: hashStr(s.planet + '|' + bucket + '|' + c.id) }))
    .sort((a, b) => a.h - b.h)
    .slice(0, 3)
    .map(x => x.c);
}

function hire(s, cardId) {
  const c = CARD[cardId];
  if (!c || s.owned.includes(cardId)) return { ok: false, msg: 'Уже в команде.' };
  if (!tavernList(s).some(x => x.id === cardId)) return { ok: false, msg: 'В таверне его уже нет.' };
  if (s.cash < c.cost) return { ok: false, msg: 'Не хватает денег.' };
  s.cash -= c.cost;
  s.owned.push(cardId);
  if (!s.crew[c.role]) s.crew[c.role] = cardId;
  note(s, 'В команду нанят: ' + c.name + ' (' + ROLES[c.role] + ').');
  return { ok: true };
}

function equip(s, cardId) {
  const c = CARD[cardId];
  if (!c || !s.owned.includes(cardId)) return { ok: false, msg: 'Этого человека нет в команде.' };
  s.crew[c.role] = cardId;
  const st = stats(s);
  s.hull = Math.min(s.hull, st.hullMax);
  note(s, c.name + ' теперь на посту: ' + ROLES[c.role] + '.');
  trimCargo(s);
  return { ok: true };
}

// Если трюм сжался (ушёл квартирмейстер), лишние ящики выбрасываются, дешёвые первыми.
function trimCargo(s) {
  const st = stats(s);
  let over = cargoCount(s) - st.hold;
  if (over <= 0) return 0;
  const dropped = over;
  const order = Object.keys(s.hold).sort((a, b) => GOOD[a].base - GOOD[b].base);
  for (const g of order) {
    if (over <= 0) break;
    const d = Math.min(over, s.hold[g]);
    s.basis[g] = (s.basis[g] || 0) * (1 - d / s.hold[g]);
    s.hold[g] -= d; over -= d;
    if (s.hold[g] <= 0) { delete s.hold[g]; delete s.basis[g]; }
  }
  note(s, 'Трюм стал меньше: за борт ушло ' + dropped + ' ящ.');
  return dropped;
}

// ---------- полёт ----------
// Рейс состоит из двух частей. Сначала цеппель идёт по планете отправления к точке перехода:
// это время, топливо, пираты и грозы. Потом переход через Пустоту: он мгновенный, и цеппель
// сразу оказывается в порту назначения. Здесь могут встретиться Знаки Пустоты.
// Длина планетного этапа и опасность порта придуманы для прототипа.
const LEG = {
  zagrata: { days: 2, fuel: 2 },
  tarnok:  { days: 1, fuel: 1 },
  ahadir:  { days: 3, fuel: 3 },
  velmar:  { days: 1, fuel: 1 },
  eltram:  { days: 2, fuel: 2 },
  seryi:   { days: 3, fuel: 3 },
};

function route(s, destId) {
  const a = PLANET[s.planet], b = PLANET[destId];
  const dist = Math.hypot(a.x - b.x, a.y - b.y);
  const st = stats(s);
  const leg = LEG[s.planet];
  return {
    dist,
    fuel: Math.max(1, Math.ceil((leg.fuel + dist / 55) * st.fuelMul)),
    days: leg.days,
  };
}

function maxRange(s) { // дальность перехода в единицах карты на остатке топлива после планетного этапа
  const st = stats(s);
  return Math.max(0, (s.fuel / st.fuelMul - LEG[s.planet].fuel) * 55);
}

// Фронтир и воюющая Заграта хуже, университетские и паломнические трассы патрулируются.
const DANGER = { zagrata: 0.07, tarnok: 0.0, ahadir: -0.04, velmar: -0.03, eltram: -0.05, seryi: 0.12 };

function cargoValue(s) {
  let v = 0;
  for (const [g, n] of Object.entries(s.hold)) v += n * GOOD[g].base;
  return v;
}

// Вероятность встретить пиратов в рейсе.
// Зависит от порта, из которого вылетаем, и от стоимости груза.
function pirateRaw(s) {
  return clamp(0.20 + (DANGER[s.planet] || 0) + Math.min(0.18, cargoValue(s) / 22000), 0.08, 0.6);
}
// Что игрок видит на карте: шанс столкнуться с пиратами.
function pirateRisk(s) {
  return pirateRaw(s);
}

function signChance(s) {
  return clamp(SIGN_BASE * stats(s).signMul, 0, 0.5);
}

function rollEvent(s) {
  const st = stats(s);
  const r = rnd(s);
  const pPir = pirateRaw(s);
  if (r < pPir) {
    const strength = 2 + Math.floor(rnd(s) * 3) + Math.min(5, Math.floor(s.stats.trips / 9));
    return { type: 'pirates', strength };
  }
  if (r < pPir + 0.15) {
    return { type: 'storm' };
  }
  if (r < pPir + 0.15 + 0.05) {
    const good = GOODS[Math.floor(rnd(s) * GOODS.length)].id;
    return { type: 'salvage', good, qty: 2 + Math.floor(rnd(s) * 3) };
  }
  return { type: 'calm', text: CALM_LINES[Math.floor(rnd(s) * CALM_LINES.length)] };
}

function pirateOptions(s, ev) {
  const st = stats(s);
  const tribute = ev.strength * 70 + Math.round(cargoValue(s) * 0.12);
  return {
    tribute,
    canPay: s.cash >= tribute,
    guns: st.guns,
    need: Math.ceil(ev.strength * 1.6),
  };
}

// Шанс выиграть бой в процентах: мощь = пушки*2 + бросок 0..4.
function fightOdds(o) {
  let wins = 0;
  for (let k = 0; k < 5; k++) if (o.guns * 2 + k >= o.need) wins++;
  return wins * 20;
}

// Переход через Пустоту. Мгновенный; иногда проявляется Знак Пустоты.
// 90% знаков зловещие: гибнет или пропадает случайный член экипажа, если он не ямауда.
// Остальные благие: небольшая удача.
function jump(s) {
  if (rnd(s) >= signChance(s)) return null;
  s.stats.signs++;
  if (rnd(s) < SIGN_BAD) {
    if (!s.owned.length) {
      note(s, 'Знак Пустоты прошёл мимо: на борту некому ответить.');
      return { bad: true, none: true, text: 'Знак Пустоты прошёл мимо пустого корабля.' };
    }
    const id = s.owned[Math.floor(rnd(s) * s.owned.length)];
    const c = CARD[id];
    if (c.yamauda) {
      note(s, 'Знак Пустоты коснулся ' + c.name + ', но ямауда невосприимчив к Пустоте.');
      return { bad: true, immune: true, who: c.name, role: ROLES[c.role], text: 'Знак Пустоты коснулся ' + c.name + ' (' + ROLES[c.role] + '), но ямауда невосприимчив к Пустоте.' };
    }
    s.owned = s.owned.filter(x => x !== id);
    for (const r of ROLE_ORDER) if (s.crew[r] === id) s.crew[r] = null;
    s.stats.voidLost++;
    const st = stats(s);
    s.hull = Math.min(s.hull, st.hullMax);
    const dropped = trimCargo(s);
    note(s, 'Знак Пустоты: ' + c.name + ' (' + ROLES[c.role] + ') потерян в переходе.');
    return { bad: true, lost: true, who: c.name, role: ROLES[c.role], dropped, text: 'Зловещий Знак Пустоты. ' + c.name + ' (' + ROLES[c.role] + ') потерян в переходе.' + (dropped ? ' Трюм стал меньше, ' + dropped + ' ящ. ушло за борт.' : '') };
  }
  const st = stats(s);
  const roll = rnd(s);
  let text;
  if (roll < 0.34) { s.hull = st.hullMax; text = 'Благой Знак Пустоты: корпус цел и невредим.'; }
  else if (roll < 0.67) { s.fuel = Math.min(st.tank, s.fuel + 6); text = 'Благой Знак Пустоты: баки пополнились на 6.'; }
  else { const gain = 150 + Math.floor(rnd(s) * 250); s.cash += gain; text = 'Благой Знак Пустоты: в трюме нашлась шкатулка, +' + gain + '.'; }
  note(s, text);
  return { bad: false, text };
}

function applyDamage(s, dmg) {
  s.hull -= dmg;
  if (s.hull <= 0) {
    const st = stats(s);
    s.stats.wrecks++;
    s.hold = {};
    s.basis = {};
    s.cash = Math.floor(s.cash * 0.65);
    s.hull = Math.ceil(st.hullMax * 0.25);
    if (s.flight) s.flight.aborted = true; // до перехода не дошли
    note(s, 'Цеппелин разбит на планетном этапе. Буксир вернул его в порт отправления; груз потерян, ремонт и буксир стоили трети казны.');
    return true;
  }
  return false;
}

function applyEvent(s, ev, choice) {
  const st = stats(s);
  switch (ev.type) {
    case 'evaded':
    case 'calm':
      return note(s, ev.text);
    case 'storm': {
      const dmg = Math.max(1, Math.round((5 + rnd(s) * 8) * st.dmgMul));
      ev.text = note(s, 'Гроза. Корпус потерял ' + dmg + '.');
      if (applyDamage(s, dmg)) ev.text += ' Цеппелин разбит: груз потерян, буксир вернул его в порт отправления.';
      return;
    }
    case 'salvage': {
      const free = st.hold - cargoCount(s);
      if (free > 0) {
        const n = Math.min(ev.qty, free);
        s.hold[ev.good] = (s.hold[ev.good] || 0) + n;
        s.basis[ev.good] = s.basis[ev.good] || 0;
        ev.text = note(s, 'Дрейфующий остов. Подняли на борт: ' + GOOD[ev.good].name + ' ×' + n + '.');
      } else {
        const gain = 60 + Math.floor(rnd(s) * 140);
        s.cash += gain;
        ev.text = note(s, 'Дрейфующий остов. Трюм полон, забрали только ценное: +' + gain + '.');
      }
      return;
    }
    case 'pirates': {
      const o = pirateOptions(s, ev);
      s.stats.pirates++;
      if (choice === 'pay' && o.canPay) {
        s.cash -= o.tribute;
        ev.text = note(s, 'Откупились от пиратов: −' + o.tribute + '.');
        return;
      }
      const power = o.guns * 2 + Math.floor(rnd(s) * 5);
      if (power >= o.need) {
        const loot = ev.strength * 35;
        const dmg = Math.round((1 + ev.strength * rnd(s) * 1.2) * st.dmgMul);
        s.cash += loot;
        ev.text = note(s, 'Бой выигран: трофеи +' + loot + (dmg ? ', корпус −' + dmg : '') + '.');
        if (dmg && applyDamage(s, dmg)) ev.text += ' Цеппелин разбит: груз потерян, буксир вернул его в порт отправления.';
      } else {
        const dmg = Math.max(1, Math.round((ev.strength * 3.5 + rnd(s) * 5) * st.dmgMul));
        const tax = Math.floor(s.cash * 0.1);
        s.cash -= tax;
        let lost = 0;
        for (const g of Object.keys(s.hold)) {
          const l = Math.floor(s.hold[g] * 0.45);
          if (l > 0) {
            s.basis[g] = (s.basis[g] || 0) * (1 - l / s.hold[g]);
            s.hold[g] -= l; lost += l;
          }
        }
        ev.text = note(s, 'Бой проигран: корпус −' + dmg + (lost ? ', пираты забрали ' + lost + ' ящ.' : '') + (tax ? ' и ' + tax + ' из казны' : '') + '.');
        if (applyDamage(s, dmg)) ev.text += ' Цеппелин разбит: груз потерян, буксир вернул его в порт отправления.';
      }
      return;
    }
  }
}

function arrive(s) {
  const f = s.flight;
  s.day += f.days;
  if (f.aborted) {
    note(s, 'Возвращение в порт отправления: ' + PLANET[s.planet].name + '.');
  } else {
    s.planet = f.dest;
    s.stats.trips++;
    note(s, 'Прибытие: ' + PLANET[s.planet].name + '.');
  }
  s.flight = null;
}

// Завершает рейс: если цеппелин дошёл до точки перехода, выполняется переход.
function finishFlight(s, result) {
  if (!s.flight.aborted) {
    const sign = jump(s);
    if (sign) result.sign = sign;
  }
  arrive(s);
  return result;
}

// Вылет. Списывает топливо и жалованье, запускает таймер (eta) и возвращает {ok, flying}.
// Что случилось по дороге, решается в completeFlight, когда таймер истёк.
// opts.now: время вылета в мс (по умолчанию сейчас); opts.instant: без паузы (для ботов и тестов).
function depart(s, destId, opts) {
  opts = opts || {};
  if (s.over) return { ok: false, msg: 'Игра окончена.' };
  if (destId === s.planet) return { ok: false, msg: 'Вы уже здесь.' };
  if (s.flight) return { ok: false, msg: 'Полёт уже идёт.' };
  const r = route(s, destId);
  if (s.fuel < r.fuel) return { ok: false, msg: 'Не хватает топлива: нужно ' + r.fuel + ', есть ' + s.fuel + '.' };
  const st = stats(s);
  s.fuel -= r.fuel;
  const due = st.wage * r.days;
  const wages = Math.min(s.cash, due);
  s.cash -= wages;
  note(s, 'Вылет из порта ' + PLANET[s.planet].name + ' к переходу в ' + PLANET[destId].name + ': ' + r.fuel + ' топлива, ' + r.days + ' дн. по планете, жалованье −' + wages + '.');
  if (wages < due) { // нечем платить: самый дорогой человек сходит на берег навсегда
    const crew = equipped(s).sort((x, y) => y.wage - x.wage);
    if (crew.length) {
      const c = crew[0];
      s.crew[c.role] = null;
      s.owned = s.owned.filter(id => id !== c.id);
      s.stats.deserted++;
      note(s, 'Жалованья не хватило: ' + c.name + ' (' + ROLES[c.role] + ') ушёл с корабля навсегда.');
      trimCargo(s);
    }
  }
  const now = opts.now != null ? opts.now : Date.now();
  s.flight = { dest: destId, days: r.days, ev: null, aborted: false, t0: now, eta: now + (opts.instant ? 0 : flightMs(r.days)) };
  if (opts.instant) return completeFlight(s);
  return { ok: true, flying: true, eta: s.flight.eta, days: r.days };
}

// Когда таймер полёта истёк: происходит событие планетного этапа, затем переход и прибытие.
// Возвращает {ok, pending?, ev?, sign?}. Если pending — интерфейс спрашивает игрока
// и вызывает resolveFlight(s, choice).
function completeFlight(s) {
  if (!s.flight) return { ok: false, msg: 'Нет полёта.' };
  if (s.flight.ev) return { ok: true, pending: s.flight.ev.type === 'pirates', ev: s.flight.ev }; // уже брошено
  const ev = rollEvent(s);
  s.flight.ev = ev;
  if (ev.type === 'pirates') return { ok: true, pending: true, ev };
  applyEvent(s, ev, null);
  return finishFlight(s, { ok: true, pending: false, ev });
}

function resolveFlight(s, choice) {
  if (!s.flight || !s.flight.ev) return { ok: false, msg: 'Нет полёта.' };
  const ev = s.flight.ev;
  applyEvent(s, ev, choice);
  return finishFlight(s, { ok: true, ev });
}

// Банкротство: игра заканчивается, когда нечем продолжать.
// Груз в расчёте идёт по заниженной цене, потому что продавать придётся с потерями.
function liquidity(s) {
  let v = s.cash;
  for (const [g, n] of Object.entries(s.hold)) v += n * GOOD[g].base * 0.6;
  return v;
}

function checkBankrupt(s) {
  if (s.over) return true;
  if (s.flight) return false;
  const minFuel = Math.min(...PLANETS.filter(p => p.id !== s.planet).map(p => route(s, p.id).fuel));
  const topUp = Math.max(0, minFuel - s.fuel) * FUEL_PRICE;
  const liq = liquidity(s);
  if (liq < BANKRUPT_FLOOR || (s.fuel < minFuel && liq < topUp + BANKRUPT_FLOOR / 2)) {
    s.over = { day: s.day, worth: netWorth(s), peak: s.stats.peak || 0 };
    note(s, 'Банкротство. Кредиторы описали цеппелин на причале ' + PLANET[s.planet].name + '.');
    return true;
  }
  return false;
}

function trackPeak(s) {
  const w = netWorth(s);
  if (w > (s.stats.peak || 0)) s.stats.peak = w;
}

// ---------- сохранение ----------
function serialize(s) { return JSON.stringify(s); }
function deserialize(txt) {
  try {
    const s = JSON.parse(txt);
    if (!s || s.v !== 1 || !PLANET[s.planet]) return null;
    s.hold = s.hold || {}; s.basis = s.basis || {};
    s.log = Array.isArray(s.log) ? s.log : [];
    return s;
  } catch (e) { return null; }
}

function describeEff(eff) {
  const out = [];
  if (eff.fuel) out.push((eff.fuel < 0 ? '−' : '+') + Math.round(Math.abs(eff.fuel) * 100) + '% топлива');
  if (eff.sign) out.push('знаки Пустоты −' + Math.round(Math.abs(eff.sign) * 100) + '%');
  if (eff.hull) out.push('корпус +' + eff.hull);
  if (eff.dmg) out.push('урон −' + Math.round(Math.abs(eff.dmg) * 100) + '%');
  if (eff.guns) out.push('пушки +' + eff.guns);
  if (eff.hold) out.push('трюм +' + eff.hold);
  if (eff.buy) out.push('покупка −' + Math.round(Math.abs(eff.buy) * 100) + '%');
  if (eff.sell) out.push('продажа +' + Math.round(eff.sell * 100) + '%');
  return out.join(' · ');
}

  };
}

// ============================================================
// ИНТЕРФЕЙС И СЕТЬ
// Слой сети (Backend) отделён от логики: ядро знает только про PressureStore.
// Онлайн включается сам, если у страницы есть db и user; иначе игра автономна.
// ============================================================

const $ = sel => document.querySelector(sel);

// Графика: build.py подставляет сюда найденные в art/ файлы (имя без расширения -> путь).
// Нет файла для слота: элемент просто не рисуется, игра выглядит как прежде.
const ART = {};
function artImg(slot, cls, alt) {
  if (!ART[slot]) return '';
  return '<img class="art ' + cls + '" src="' + ART[slot] + '" alt="' + esc(alt || '') + '" loading="lazy" decoding="async">';
}
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.classList.contains('art')) t.remove();
}, true);
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('ru-RU');

// ---------- состояние ----------
function loadSave() {
  try { const t = localStorage.getItem(SAVE_KEY); return t ? deserialize(t) : null; } catch (e) { return null; }
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, serialize(S)); } catch (e) { /* хранилище может быть недоступно */ }
}

let S = loadSave() || newGame();
const store = new PressureStore();
let tab = 'market';
let selDest = null;
let toastTimer = null;
let confirmReset = false;
let bulletin = null;   // последнее событие в пути (гроза, находка, бой), пока не закрыто
let flightTimer = null;

const net = {
  mode: 'local',      // local | online
  writable: false,
  db: null,
  uid: null,
  board: [],
  lastScore: '',
  bestPeak: 0,
};

// ---------- сеть ----------
const pending = {};
let flushTimer = null;
let flushing = false;

function queueMarketWrite(key, d) {
  if (!net.db || !net.writable) return;
  pending[key] = d;
  if (!flushTimer) flushTimer = setTimeout(flushMarket, 600);
}

async function flushMarket() {
  flushTimer = null;
  if (flushing) { flushTimer = setTimeout(flushMarket, 600); return; }
  flushing = true;
  try {
    for (const key of Object.keys(pending)) {
      const d = pending[key];
      delete pending[key];
      try { await net.db.doc('market/' + key).set(d); }
      catch (e) { if (e && e.code === 'invalid_argument') { net.writable = false; renderNet(); } }
    }
  } finally { flushing = false; }
}

let scoreTimer = null;
let scoreBusy = false;
function scheduleScore() {
  if (!net.db || !net.writable || !net.uid) return;
  if (scoreTimer) clearTimeout(scoreTimer);
  scoreTimer = setTimeout(publishScore, 1500);
}
async function publishScore() {
  scoreTimer = null;
  if (!net.db || !net.writable || !net.uid) return;
  if (scoreBusy) { scoreTimer = setTimeout(publishScore, 1500); return; }
  const peak = Math.max(S.stats.peak || 0, net.bestPeak || 0);
  const doc = { name: S.name.slice(0, 24), worth: netWorth(S), peak, day: S.day, trips: S.stats.trips, over: !!S.over, ts: Date.now() };
  const sig = doc.name + '|' + doc.worth + '|' + doc.peak + '|' + doc.day + '|' + doc.over;
  if (sig === net.lastScore) return;
  scoreBusy = true;
  try { await net.db.doc('pilots/' + net.uid).set(doc); net.lastScore = sig; net.bestPeak = peak; }
  catch (e) { if (e && e.code === 'invalid_argument') { net.writable = false; renderNet(); } }
  finally { scoreBusy = false; }
}

async function goOnline() {
  try {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) return;
    net.uid = await user.id();
    let can = null;
    try { can = await user.can('data.write'); } catch (e) { /* неизвестно: решит первая запись */ }
    net.db = db;
    net.writable = !!net.uid && can !== false;
    net.mode = 'online';
    store.onWrite = queueMarketWrite;
    db.collection('market').onSnapshot(snap => {
      for (const d of snap.docs) if (d.exists) store.ingest(d.id, d.data());
      render();
    }, () => { net.mode = 'local'; renderNet(); });
    db.collection('pilots').orderBy('peak', 'desc').limit(20).onSnapshot(snap => {
      net.board = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data()));
      const mine = net.board.find(r => r.id === net.uid);
      if (mine && Number(mine.peak) > net.bestPeak) net.bestPeak = Number(mine.peak);
      if (tab === 'rank') render();
    }, () => { /* рейтинг недоступен, игра продолжается */ });
    renderNet();
    scheduleScore();
  } catch (e) { /* остаёмся автономными */ }
}

// ---------- общие действия ----------
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg || '';
  if (toastTimer) clearTimeout(toastTimer);
  if (msg) toastTimer = setTimeout(() => { el.textContent = ''; }, 3500);
}

function after(result) {
  if (result && result.ok === false && result.msg) toast(result.msg);
  else toast('');
  if (result && result.ev && result.ev.text && ['storm', 'salvage', 'pirates'].includes(result.ev.type)) {
    bulletin = { type: result.ev.type, text: result.ev.text };
  }
  trackPeak(S);
  checkBankrupt(S);
  writeSave();
  scheduleScore();
  render();
  if (S.over) showOver();
  else if (result && result.sign) showSign(result.sign);
}

// ---------- отрисовка ----------
function gauge(label, value, extra) {
  return '<div class="gauge ' + (extra && extra.cls || '') + '"><div class="lab">' + label + '</div><div class="val">' + value + '</div>' + (extra && extra.bar || '') + '</div>';
}
function bar(frac, warnAt, critAt) {
  const f = clamp(frac, 0, 1);
  const cls = f <= critAt ? 'crit' : f <= warnAt ? 'warn' : '';
  return '<div class="bar ' + cls + '"><i style="width:' + Math.round(f * 100) + '%"></i></div>';
}

function renderGauges() {
  const st = stats(S);
  const cargo = cargoCount(S);
  $('#gauges').innerHTML =
    gauge('Казна', fmt(S.cash), { cls: 'money' }) +
    gauge('День', S.day) +
    gauge('Топливо', S.fuel + '<small> / ' + st.tank + '</small>', { bar: bar(S.fuel / st.tank, 0.35, 0.15) }) +
    gauge('Корпус', S.hull + '<small> / ' + st.hullMax + '</small>', { bar: bar(S.hull / st.hullMax, 0.5, 0.25) }) +
    gauge('Трюм', cargo + '<small> / ' + st.hold + '</small>', { bar: bar(cargo / st.hold, 2, 2) });
}

function renderNet() {
  const el = $('#net');
  if (net.mode === 'online') {
    if (net.writable) { el.textContent = 'Онлайн · общий рынок'; el.className = 'net on'; }
    else { el.textContent = 'Онлайн · только чтение'; el.className = 'net ro'; }
  } else { el.textContent = 'Автономно'; el.className = 'net'; }
}

function renderTabs() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
}

function renderLog() {
  const last = S.log.slice(-5).reverse();
  let b = '';
  if (bulletin) {
    const slot = { storm: 'ev-storm', salvage: 'ev-salvage', pirates: 'ev-pirates' }[bulletin.type];
    b = '<div class="bulletin">' + artImg(slot, 'bimg', '') + '<p>' + esc(bulletin.text) + '</p>' +
      '<button class="btn" data-act="bulletin-x" aria-label="Закрыть сообщение">×</button></div>';
  }
  $('#log').innerHTML = b + last.map(l => '<div><span class="d">д.' + l.d + '</span><span>' + esc(l.t) + '</span></div>').join('');
}

function renderMarket() {
  const p = PLANET[S.planet];
  const st = stats(S);
  const free = st.hold - cargoCount(S);
  const rows = GOODS.map(g => {
    const q = quote(S, store, S.planet, g.id);
    const have = S.hold[g.id] || 0;
    const avg = have ? Math.round((S.basis[g.id] || 0) / have) : 0;
    const tag = q.ratio <= 0.88 ? '<span class="tag cheap">дёшево</span>' : q.ratio >= 1.2 ? '<span class="tag dear">дорого</span>' : '';
    const pbPct = Math.round(q.pb * 100), psPct = Math.round(-q.ps * 100);
    const buyTrend = pbPct >= 2 ? '<small class="trend">▲ ' + pbPct + '% от покупок</small>' : '';
    const sellTrend = psPct >= 2 ? '<small class="trend">▼ ' + psPct + '% от продаж</small>' : '';
    return '<div class="row">' +
      '<div class="gname">' + artImg('good-' + g.id, 'gicon', '') + '<span>' + g.name + '</span>' + tag + '</div>' +
      '<div class="gprice"><b>' + q.buy + '</b><small>покупка</small>' + buyTrend + '</div>' +
      '<div class="gsell"><b>' + q.sell + '</b><small>продажа</small>' + sellTrend + '</div>' +
      '<div class="ghave">' + (have ? '<b>' + have + ' ящ.</b><small>себест. ' + avg + '</small>' : '<small>нет в трюме</small>') + '</div>' +
      '<div class="gact">' +
        '<button class="btn buy" data-act="trade" data-m="buy" data-g="' + g.id + '" aria-label="Купить ' + g.name + '"' + (free <= 0 || S.cash < q.buy ? ' disabled' : '') + '>Купить…</button>' +
        '<button class="btn sell" data-act="trade" data-m="sell" data-g="' + g.id + '" aria-label="Продать ' + g.name + '"' + (have ? '' : ' disabled') + '>Продать…</button>' +
      '</div></div>';
  }).join('');
  const needFuel = st.tank - S.fuel, needHull = st.hullMax - S.hull;
  return '<section class="panel">' + artImg('port-' + S.planet, 'hero-img', p.name) +
    '<header><div><div class="kind">' + esc(p.kind) + '</div><h2>' + esc(p.name) + '</h2></div><small>Свободно в трюме: ' + free + '</small></header>' +
    '<p class="lead">' + esc(p.desc) + '</p>' +
    '<div class="goods">' + rows + '</div>' +
    '<div class="services">' +
      '<div class="svc"><h3>Заправка</h3><small>' + FUEL_PRICE + ' за единицу</small><button class="btn" data-act="refuel"' + (needFuel <= 0 || S.cash < FUEL_PRICE ? ' disabled' : '') + '>' + (needFuel > 0 ? 'Заправить до полного (' + fmt(Math.min(needFuel, Math.floor(S.cash / FUEL_PRICE)) * FUEL_PRICE) + ')' : 'Бак полон') + '</button></div>' +
      '<div class="svc"><h3>Ремонт</h3><small>' + REPAIR_PRICE + ' за единицу прочности</small><button class="btn" data-act="repair"' + (needHull <= 0 || S.cash < REPAIR_PRICE ? ' disabled' : '') + '>' + (needHull > 0 ? 'Починить до полного (' + fmt(Math.min(needHull, Math.floor(S.cash / REPAIR_PRICE)) * REPAIR_PRICE) + ')' : 'Корпус цел') + '</button></div>' +
    '</div></section>';
}

function goodNames(ids) { return ids.map(i => GOOD[i].name).join(', '); }

function riskChip(pct) {
  const cls = pct < 20 ? 'low' : pct < 32 ? 'mid' : 'high';
  const word = pct < 20 ? 'низкий' : pct < 32 ? 'средний' : 'высокий';
  return '<span class="risk ' + cls + '">пираты ' + pct + '% · ' + word + '</span>';
}

function stagesHtml() {
  const leg = LEG[S.planet];
  const st = stats(S);
  const pirates = Math.round(pirateRisk(S) * 100);
  const sign = Math.round(signChance(S) * 100);
  const aboard = S.owned.length;
  const immune = S.owned.filter(id => CARD[id].yamauda).length;
  return '<div class="stages">' +
    '<div class="stage"><h3>Этап 1 · по планете ' + esc(PLANET[S.planet].name) + '</h3>' +
      '<div class="facts"><span>' + leg.days + ' дн. · ' + Math.round(flightMs(leg.days) / 1000) + ' с</span><span>топливо ' + Math.ceil(leg.fuel * st.fuelMul) + '</span>' + riskChip(pirates) + '</div>' +
      '<small>Цеппель идёт к точке перехода. Пираты и грозы встречаются здесь, поэтому риск зависит от порта вылета и растёт со стоимостью груза.</small></div>' +
    '<div class="stage"><h3>Этап 2 · переход через Пустоту</h3>' +
      '<div class="facts"><span>мгновенно</span><span class="risk ' + (sign < 10 ? 'low' : sign < 15 ? 'mid' : 'high') + '">знак Пустоты ' + sign + '%</span></div>' +
      '<small>Цеппель сразу оказывается в порту назначения. Девять знаков из десяти зловещие: пропадает случайный член экипажа, если он не ямауда. На борту ' + aboard + ' чел., ямауда из них ' + immune + '.</small></div>' +
    '</div>';
}

function renderMap() {
  const here = PLANET[S.planet];
  const range = maxRange(S);
  let svg = '<svg viewBox="0 0 700 400" role="img" aria-label="Карта миров">';
  for (let x = 0; x <= 700; x += 70) svg += '<line class="m-grid" x1="' + x + '" y1="0" x2="' + x + '" y2="400"/>';
  for (let y = 0; y <= 400; y += 80) svg += '<line class="m-grid" x1="0" y1="' + y + '" x2="700" y2="' + y + '"/>';
  svg += '<circle class="m-range" cx="' + here.x + '" cy="' + here.y + '" r="' + range.toFixed(1) + '"/>';
  svg += '<text class="m-cap" x="10" y="392">пунктир: дальность перехода на остатке топлива</text>';
  if (selDest && PLANET[selDest] && selDest !== S.planet) {
    const d = PLANET[selDest];
    svg += '<line class="m-route" x1="' + here.x + '" y1="' + here.y + '" x2="' + d.x + '" y2="' + d.y + '"/>';
  }
  for (const p of PLANETS) {
    const cls = 'm-node' + (p.id === S.planet ? ' here' : '') + (p.id === selDest ? ' sel' : '');
    const anchor = p.x > 520 ? 'end' : 'start';
    const lx = p.x > 520 ? p.x - 16 : p.x + 16;
    svg += '<circle class="' + cls + '" data-act="pick" data-p="' + p.id + '" cx="' + p.x + '" cy="' + p.y + '" r="9"/>';
    svg += '<text class="m-label" text-anchor="' + anchor + '" x="' + lx + '" y="' + (p.y + 4) + '">' + esc(p.name) + '</text>';
  }
  svg += '</svg>';

  const list = PLANETS.filter(p => p.id !== S.planet).map(p => {
    const r = route(S, p.id);
    const ok = S.fuel >= r.fuel;
    return '<button class="dest' + (ok ? '' : ' far') + '" data-act="pick" data-p="' + p.id + '" aria-pressed="' + (p.id === selDest) + '">' +
      artImg('port-' + p.id, 'thumb', '') +
      '<span class="nm"><span>' + esc(p.name) + '</span><small>' + esc(p.kind) + '</small></span>' +
      '<span class="facts"><span>' + Math.round(r.dist) + ' ед.</span><span>топливо ' + r.fuel + '</span></span>' +
      '<span class="goodlist">Дёшево: <b>' + goodNames(p.cheap) + '</b></span>' +
      '<span class="goodlist">Спрос: <b>' + goodNames(p.dear) + '</b></span></button>';
  }).join('');

  let go = '<small>Выберите мир на карте или в списке.</small>';
  if (selDest && selDest !== S.planet) {
    const r = route(S, selDest);
    const ok = S.fuel >= r.fuel;
    go = '<div class="btnrow"><button class="btn primary" data-act="go"' + (ok ? '' : ' disabled') + '>Лететь в ' + esc(PLANET[selDest].name) + ' (' + Math.round(flightMs(r.days) / 1000) + ' с)</button></div>' +
      '<small>' + (ok ? 'Расход ' + r.fuel + ' топлива, ' + r.days + ' дн. по планете (на экране ' + Math.round(flightMs(r.days) / 1000) + ' с), жалованье команды ' + fmt(stats(S).wage * r.days) + '.' + (S.cash < stats(S).wage * r.days ? ' Денег на жалованье не хватает: самый дорогой член команды уйдёт.' : '') : 'Не хватает топлива: нужно ' + r.fuel + ', в баке ' + S.fuel + '. Заправьтесь на рынке.') + '</small>';
  }
  return '<section class="panel"><header><h2>Карта миров</h2><small>Вы в порту: ' + esc(here.name) + '</small></header>' +
    stagesHtml() + '<div class="mapbox">' + svg + '</div>' + go + '<div class="dest-list">' + list + '</div></section>';
}

// ---------- диалог сделки со слайдером ----------
let trade = null; // { mode: 'buy' | 'sell', g, n }

function tradeLimits(mode, g) {
  const q = quote(S, store, S.planet, g);
  if (mode === 'buy') {
    const free = stats(S).hold - cargoCount(S);
    return { q, max: Math.max(0, Math.min(free, Math.floor(S.cash / q.buy))) };
  }
  return { q, max: S.hold[g] || 0 };
}

function showTrade(mode, g) {
  const lim = tradeLimits(mode, g);
  if (lim.max <= 0) return;
  trade = { mode, g, n: mode === 'buy' ? Math.min(lim.max, Math.max(1, Math.ceil(lim.max / 2))) : lim.max };
  const buying = mode === 'buy';
  $('#modal').hidden = false;
  $('#modal').innerHTML = '<div class="box ' + (buying ? 'is-buy' : 'is-sell') + '" role="dialog" aria-modal="true" aria-labelledby="tt">' +
    '<h2 id="tt">' + (buying ? 'Купить' : 'Продать') + ': ' + GOOD[g].name + '</h2>' +
    '<div class="qty"><b class="mono" id="tn" aria-live="polite"></b><span class="small" id="tof"></span></div>' +
    '<div class="slider">' +
      '<button class="btn" data-act="trade-set" data-v="-" aria-label="Меньше на один">−</button>' +
      '<input id="tqty" type="range" min="1" max="' + lim.max + '" step="1" value="' + trade.n + '" aria-label="Количество ящиков">' +
      '<button class="btn" data-act="trade-set" data-v="+" aria-label="Больше на один">+</button>' +
    '</div>' +
    '<div class="btnrow"><button class="btn" data-act="trade-set" data-v="min">Мин</button><button class="btn" data-act="trade-set" data-v="half">Половина</button><button class="btn" data-act="trade-set" data-v="max">Макс</button></div>' +
    '<div class="sum" id="tsum"></div>' +
    '<div class="btnrow"><button class="btn primary" data-act="trade-ok" id="tok"></button><button class="btn" data-act="trade-cancel">Отмена</button></div></div>';
  updateTrade();
  const r = $('#tqty'); if (r) r.focus();
}

function updateTrade() {
  if (!trade || $('#tqty') === null) return;
  const lim = tradeLimits(trade.mode, trade.g);
  if (lim.max <= 0) { hideModal(); return; }
  const n = clamp(Math.round(trade.n), 1, lim.max);
  trade.n = n;
  const r = $('#tqty');
  r.max = String(lim.max);
  r.value = String(n);
  const q = lim.q;
  $('#tn').textContent = n + ' ящ.';
  $('#tof').textContent = ' из ' + lim.max + (trade.mode === 'buy' ? ' (по деньгам и месту в трюме)' : ' в трюме');
  let html;
  if (trade.mode === 'buy') {
    const total = n * q.buy;
    html = '<div><span>Цена за ящик</span><b class="mono">' + fmt(q.buy) + '</b></div>' +
      '<div><span>Итого</span><b class="mono">' + fmt(total) + '</b></div>' +
      '<div><span>Казна после</span><b class="mono">' + fmt(S.cash - total) + '</b></div>' +
      '<small>Каждый купленный ящик поднимает цену покупки здесь примерно на 1%.</small>';
    $('#tok').textContent = 'Купить за ' + fmt(total);
  } else {
    const have = S.hold[trade.g] || 0;
    const revenue = n * q.sell;
    const cost = have ? (S.basis[trade.g] || 0) * (n / have) : 0;
    const profit = Math.round(revenue - cost);
    html = '<div><span>Цена за ящик</span><b class="mono">' + fmt(q.sell) + '</b></div>' +
      '<div><span>Выручка</span><b class="mono">' + fmt(revenue) + '</b></div>' +
      '<div><span>Относительно закупки</span><b class="mono ' + (profit >= 0 ? 'gain' : 'loss') + '">' + (profit >= 0 ? '+' : '−') + fmt(Math.abs(profit)) + '</b></div>' +
      '<small>Каждый проданный ящик опускает цену продажи здесь примерно на 1%.</small>';
    $('#tok').textContent = 'Продать за ' + fmt(revenue);
  }
  $('#tsum').innerHTML = html;
}

function showOver() {
  trade = null;
  const o = S.over || {};
  $('#modal').hidden = false;
  $('#modal').innerHTML = '<div class="box is-over" role="alertdialog" aria-modal="true" aria-labelledby="ot">' + artImg('ev-bankrupt', 'evimg', '') +
    '<h2 id="ot">Банкротство</h2>' +
    '<p style="margin:0">Казны и груза не хватает, чтобы продолжать рейсы. Кредиторы описали цеппелин на причале ' + esc(PLANET[S.planet].name) + '.</p>' +
    '<div class="sum"><div><span>Дней в пути</span><b class="mono">' + fmt(o.day || S.day) + '</b></div>' +
    '<div><span>Рейсов</span><b class="mono">' + fmt(S.stats.trips) + '</b></div>' +
    '<div><span>Лучший капитал</span><b class="mono">' + fmt(Math.max(S.stats.peak || 0, net.bestPeak || 0)) + '</b></div></div>' +
    '<div class="btnrow"><button class="btn primary" data-act="restart">Начать заново</button></div></div>';
  const b = $('#modal .btn.primary'); if (b) b.focus();
}

function showSign(sign) {
  trade = null;
  const cls = sign.bad ? (sign.lost ? 'is-over' : 'is-sell') : 'is-buy';
  const title = !sign.bad ? 'Благой знак Пустоты' : sign.lost ? 'Зловещий знак Пустоты' : sign.immune ? 'Знак Пустоты не тронул экипаж' : 'Знак Пустоты';
  $('#modal').hidden = false;
  $('#modal').innerHTML = '<div class="box ' + cls + '" role="alertdialog" aria-modal="true" aria-labelledby="st">' + artImg(sign.bad ? 'ev-sign-bad' : 'ev-sign-good', 'evimg', '') +
    '<h2 id="st">' + esc(title) + '</h2><p style="margin:0">' + esc(sign.text) + '</p>' +
    '<div class="btnrow"><button class="btn primary" data-act="ack">Продолжить</button></div></div>';
  const b = $('#modal .btn.primary'); if (b) b.focus();
}

// ---------- перелёт: пауза 15 с на день ----------
const SHIP_SVG = '<svg class="shipsvg" viewBox="0 0 240 100" aria-hidden="true">' +
  '<ellipse class="env" cx="120" cy="38" rx="100" ry="30"/>' +
  '<path class="rib" d="M60 12 Q52 38 60 64 M90 9 Q82 38 90 67 M120 8 Q112 38 120 68 M150 9 Q142 38 150 67 M180 12 Q172 38 180 64"/>' +
  '<path class="fin" d="M30 24 L6 6 L24 38 Z M30 52 L6 70 L24 40 Z"/>' +
  '<path class="strut" d="M105 66 L108 74 M135 66 L132 74"/>' +
  '<rect class="gon" x="94" y="74" width="52" height="14" rx="5"/>' +
  '<ellipse class="prop" cx="154" cy="81" rx="3" ry="12"/></svg>';

function buildFlightBox() {
  const f = S.flight;
  const sky = ART.sky
    ? '<div class="track">' + [0, 1, 2, 3].map(i => '<img class="art' + (i % 2 ? ' flip' : '') + '" src="' + ART.sky + '" alt="">').join('') + '</div>'
    : '<div class="clouds c1"></div><div class="clouds c2"></div>';
  const ship = ART.ship ? '<img class="art flyimg" src="' + ART.ship + '" alt="">' : SHIP_SVG;
  $('#modal').hidden = false;
  $('#modal').innerHTML = '<div class="box flightbox" role="status">' +
    '<div class="sky">' + sky + '<div class="flyer">' + ship + '</div></div>' +
    '<h2>В пути: ' + esc(PLANET[S.planet].name) + ' → ' + esc(PLANET[f.dest].name) + '</h2>' +
    '<div class="bar"><i id="fl-bar" style="width:0%"></i></div>' +
    '<div class="fl-meta"><span id="fl-stage"></span><b class="mono" id="fl-left"></b></div>' +
    '<small>' + f.days + ' дн. по планете, на экране ' + Math.round(flightMs(f.days) / 1000) + ' с. Затем мгновенный переход через Пустоту.</small></div>';
}

function tickFlight() {
  const f = S.flight;
  if (!f) { stopFlight(); return; }
  const eta = f.eta != null ? f.eta : 0;
  const total = Math.max(1, eta - (f.t0 != null ? f.t0 : eta - 1));
  const left = Math.max(0, eta - Date.now());
  const pct = clamp(1 - left / total, 0, 1);
  const bar = $('#fl-bar');
  if (bar) bar.style.width = Math.round(pct * 100) + '%';
  const lt = $('#fl-left');
  if (lt) lt.textContent = Math.ceil(left / 1000) + ' с';
  const stg = $('#fl-stage');
  if (stg) stg.textContent = pct < 0.85 ? 'Идём по планете к точке перехода' : 'Подходим к точке перехода';
  if (left <= 0) { stopFlight(); landFlight(); }
}

function stopFlight() { if (flightTimer) { clearInterval(flightTimer); flightTimer = null; } }

function startFlightUI() {
  if (!S.flight || flightTimer) return;
  buildFlightBox();
  flightTimer = setInterval(tickFlight, 200);
  tickFlight();
}

function landFlight() {
  const r = completeFlight(S);
  hideModal();
  selDest = null; tab = 'market';
  if (r.pending) { writeSave(); render(); return showPirates(); }
  return after(r);
}

function startNew() {
  const name = S.name;
  S = newGame(name);
  confirmReset = false; selDest = null; tab = 'market';
  net.lastScore = '';
  hideModal();
  return after({ ok: true });
}

function hideModal() { trade = null; $('#modal').hidden = true; $('#modal').innerHTML = ''; }

// ---------- события ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act]');
  if (!t) return;
  if (t.dataset.tab) {
    tab = t.dataset.tab;
    confirmReset = false;
    render();
    return;
  }
  const a = t.dataset.act;
  switch (a) {
    case 'trade': return showTrade(t.dataset.m, t.dataset.g);
    case 'trade-set': {
      if (!trade) return;
      const max = tradeLimits(trade.mode, trade.g).max;
      const v = t.dataset.v;
      trade.n = v === '-' ? trade.n - 1 : v === '+' ? trade.n + 1 : v === 'min' ? 1 : v === 'half' ? Math.ceil(max / 2) : max;
      return updateTrade();
    }
    case 'trade-ok': {
      if (!trade) return;
      const { mode, g, n } = trade;
      hideModal();
      return after(mode === 'buy' ? buy(S, store, g, n) : sell(S, store, g, n));
    }
    case 'trade-cancel': return hideModal();
    case 'refuel': return after(refuel(S, 999));
    case 'repair': return after(repair(S, 999));
    case 'upg': return after(upgrade(S, t.dataset.k));
    case 'hire': return after(hire(S, t.dataset.c));
    case 'equip': return after(equip(S, t.dataset.c));
    case 'pick': selDest = t.dataset.p === S.planet ? null : t.dataset.p; return render();
    case 'go': {
      bulletin = null;
      const r = depart(S, selDest, { now: Date.now() });
      if (!r.ok) return after(r);
      writeSave();
      render();
      return startFlightUI();
    }
    case 'bulletin-x': bulletin = null; return render();
    case 'pirate': {
      hideModal();
      const r = resolveFlight(S, t.dataset.c);
      selDest = null; tab = 'market';
      return after(r);
    }
    case 'ack': hideModal(); return render();
    case 'reset': confirmReset = true; return render();
    case 'reset-no': confirmReset = false; return render();
    case 'reset-yes': return startNew();
    case 'restart': return startNew();
  }
});

document.addEventListener('input', e => {
  if (e.target && e.target.id === 'tqty' && trade) {
    trade.n = Number(e.target.value);
    updateTrade();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && trade) hideModal();
});
$('#modal').addEventListener('click', e => {
  if (trade && e.target === $('#modal')) hideModal();
});

document.addEventListener('change', e => {
  if (e.target && e.target.id === 'pname') {
    S.name = (e.target.value || '').trim().slice(0, 24) || S.name;
    writeSave();
    scheduleScore();
    render();
  }
});
document.addEventListener('focusout', e => {
  if (e.target && e.target.id === 'pname') setTimeout(render, 0);
});

// ---------- запуск ----------
(function init() {
  $('#banner').innerHTML = artImg('banner', 'banner-img', 'Паровой Торг');
  render();
  if (S.flight) {
    if (S.flight.ev && S.flight.ev.type === 'pirates') showPirates();
    else if (S.flight.eta != null) startFlightUI();   // рейс идёт: продолжаем отсчёт или сразу садимся
    else S.flight = null;
  }
  if (S.over) showOver();
  goOnline();
})();

</script>
